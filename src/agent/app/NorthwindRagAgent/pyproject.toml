[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NorthwindRagAgent"
version = "0.1.0"
description = "AgentCore Runtime Application using Strands SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp ~= 1.24.0",
    "strands-agents >= 1.15.0",
    # The Northwind corpus tools in rag_tools.py reuse the repository's rag
    # package. These are its query-time dependencies. The BGE reranker is
    # deliberately left out: it would pull in torch for no Tier A benefit.
    "pinecone >= 7.0",
    "python-dotenv >= 1.0",
    "PyYAML >= 6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
